[package]
name = "agent-statusline"
version = "0.2.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"

[dependencies]
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
terminal_size = "0.4.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
